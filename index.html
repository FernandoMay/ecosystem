<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Ecosystem Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a202c;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }
        canvas {
            background-color: #2d3748;
            border-radius: 0.5rem;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <h1 class="text-4xl font-bold mb-4">Virtual Ecosystem Simulation</h1>
    <div id="stats" class="text-lg mb-4">
        <span>Day: <span id="day">0</span></span> |
        <span>Herbivores: <span id="herbivore-count">0</span></span> |
        <span>Carnivores: <span id="carnivore-count">0</span></span> |
        <span>Plants: <span id="plant-count">0</span></span>
    </div>

    <canvas id="ecosystem" width="800" height="600"></canvas>

    <div class="mt-4 flex space-x-4">
        <button id="start-pause" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">Start</button>
        <button id="restart" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">Restart</button>
    </div>

    <script>
        const canvas = document.getElementById('ecosystem');
        const ctx = canvas.getContext('2d');

        // --- Simulation Parameters ---
        let day = 0;
        let simulationRunning = false;
        const width = canvas.width;
        const height = canvas.height;
        const initialHerbivores = 20;
        const initialCarnivores = 5;
        const initialPlants = 100;
        const plantGrowthRate = 2;

        let herbivores = [];
        let carnivores = [];
        let plants = [];
        let simulationInterval;

        // --- DOM Elements ---
        const dayEl = document.getElementById('day');
        const herbivoreCountEl = document.getElementById('herbivore-count');
        const carnivoreCountEl = document.getElementById('carnivore-count');
        const plantCountEl = document.getElementById('plant-count');
        const startPauseBtn = document.getElementById('start-pause');
        const restartBtn = document.getElementById('restart');


        // --- Base Creature Class ---
        class Creature {
            constructor(x, y, radius, color) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.energy = 100;
                this.age = 0;
                this.maxAge = 200 + Math.random() * 100; // Lifespan in days
                this.speed = 1 + Math.random();
                this.direction = Math.random() * 2 * Math.PI;
            }

            move() {
                this.x += Math.cos(this.direction) * this.speed;
                this.y += Math.sin(this.direction) * this.speed;
                this.energy -= 0.1;

                // Wall collision
                if (this.x < this.radius || this.x > width - this.radius) {
                    this.direction = Math.PI - this.direction;
                    this.x = Math.max(this.radius, Math.min(width - this.radius, this.x));
                }
                if (this.y < this.radius || this.y > height - this.radius) {
                    this.direction = -this.direction;
                    this.y = Math.max(this.radius, Math.min(height - this.radius, this.y));
                }

                // Randomly change direction
                if (Math.random() < 0.05) {
                    this.direction += (Math.random() - 0.5) * Math.PI / 2;
                }
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            isDead() {
                return this.energy <= 0 || this.age > this.maxAge;
            }
            
            update() {
                this.age++;
                this.move();
            }
        }

        // --- Herbivore Class ---
        class Herbivore extends Creature {
            constructor(x, y) {
                super(x, y, 5, 'rgba(52, 211, 153, 0.8)'); // Green
                this.reproductionCooldown = 0;
            }
            
            eat() {
                 for (let i = plants.length - 1; i >= 0; i--) {
                    const plant = plants[i];
                    const dist = Math.hypot(this.x - plant.x, this.y - plant.y);
                    if (dist < this.radius + plant.radius) {
                        this.energy += plant.energy;
                        plants.splice(i, 1);
                        break; 
                    }
                }
            }

            reproduce() {
                if (this.energy > 150 && this.reproductionCooldown <= 0) {
                    this.energy -= 50;
                    this.reproductionCooldown = 50; // days
                    return new Herbivore(this.x, this.y);
                }
                return null;
            }

            update() {
                super.update();
                this.eat();
                if (this.reproductionCooldown > 0) {
                    this.reproductionCooldown--;
                }
            }
        }

        // --- Carnivore Class ---
        class Carnivore extends Creature {
            constructor(x, y) {
                super(x, y, 7, 'rgba(239, 68, 68, 0.8)'); // Red
                this.speed = 1.2 + Math.random() * 0.5;
                this.reproductionCooldown = 0;
            }

            hunt() {
                let closestPrey = null;
                let minDistance = Infinity;

                for (const herbivore of herbivores) {
                    const dist = Math.hypot(this.x - herbivore.x, this.y - herbivore.y);
                    if (dist < minDistance) {
                        minDistance = dist;
                        closestPrey = herbivore;
                    }
                }

                if (closestPrey) {
                    // Move towards prey
                    this.direction = Math.atan2(closestPrey.y - this.y, closestPrey.x - this.x);

                    // If prey is caught
                    if (minDistance < this.radius + closestPrey.radius) {
                        this.energy += closestPrey.energy * 0.5; // Gain half the prey's energy
                        closestPrey.energy = 0; // Kill the herbivore
                    }
                }
            }
            
             reproduce() {
                if (this.energy > 200 && this.reproductionCooldown <= 0) {
                    this.energy -= 100;
                    this.reproductionCooldown = 80; // days
                    return new Carnivore(this.x, this.y);
                }
                return null;
            }

            update() {
                super.update();
                this.hunt();
                if (this.reproductionCooldown > 0) {
                    this.reproductionCooldown--;
                }
            }
        }
        
        // --- Plant Class ---
        class Plant {
            constructor(x,y){
                this.x = x;
                this.y = y;
                this.radius = 3;
                this.energy = 20;
                this.color = 'rgba(74, 222, 128, 0.6)';
            }
            draw(){
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // --- Simulation Functions ---
        function init() {
            day = 0;
            herbivores = [];
            carnivores = [];
            plants = [];

            for (let i = 0; i < initialHerbivores; i++) {
                herbivores.push(new Herbivore(Math.random() * width, Math.random() * height));
            }
            for (let i = 0; i < initialCarnivores; i++) {
                carnivores.push(new Carnivore(Math.random() * width, Math.random() * height));
            }
            for (let i = 0; i < initialPlants; i++) {
                plants.push(new Plant(Math.random() * width, Math.random() * height));
            }
            draw();
            updateStats();
        }

        function gameLoop() {
            day++;

            // Clear canvas
            ctx.clearRect(0, 0, width, height);
            
            // Grow new plants
            for(let i=0; i<plantGrowthRate; i++){
                if(plants.length < 500) { // Max plants
                     plants.push(new Plant(Math.random() * width, Math.random() * height));
                }
            }

            let newHerbivores = [];
            let newCarnivores = [];

            // Update Herbivores
            herbivores.forEach(h => {
                h.update();
                const offspring = h.reproduce();
                if (offspring) newHerbivores.push(offspring);
            });
            
            // Update Carnivores
            carnivores.forEach(c => {
                c.update();
                const offspring = c.reproduce();
                if(offspring) newCarnivores.push(offspring);
            });

            // Add newborns
            herbivores = herbivores.concat(newHerbivores);
            carnivores = carnivores.concat(newCarnivores);

            // Remove dead creatures
            herbivores = herbivores.filter(h => !h.isDead());
            carnivores = carnivores.filter(c => !c.isDead());
            
            // Draw everything
            draw();
            updateStats();

            if (herbivores.length === 0 && carnivores.length === 0) {
                toggleSimulation();
                 alert("All creatures have perished. The ecosystem has collapsed.");
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            plants.forEach(p => p.draw());
            herbivores.forEach(h => h.draw());
            carnivores.forEach(c => c.draw());
        }

        function updateStats() {
            dayEl.textContent = day;
            herbivoreCountEl.textContent = herbivores.length;
            carnivoreCountEl.textContent = carnivores.length;
            plantCountEl.textContent = plants.length;
        }

        function toggleSimulation() {
            simulationRunning = !simulationRunning;
            if (simulationRunning) {
                startPauseBtn.textContent = 'Pause';
                startPauseBtn.classList.remove('bg-green-500', 'hover:bg-green-600');
                startPauseBtn.classList.add('bg-yellow-500', 'hover:bg-yellow-600');
                simulationInterval = setInterval(gameLoop, 100); // Update every 100ms
            } else {
                startPauseBtn.textContent = 'Start';
                startPauseBtn.classList.remove('bg-yellow-500', 'hover:bg-yellow-600');
                startPauseBtn.classList.add('bg-green-500', 'hover:bg-green-600');
                clearInterval(simulationInterval);
            }
        }
        
        // --- Event Listeners ---
        startPauseBtn.addEventListener('click', toggleSimulation);
        restartBtn.addEventListener('click', () => {
             if (simulationRunning) {
                toggleSimulation();
            }
            init();
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            herbivores.push(new Herbivore(x, y));
            if(!simulationRunning){
                 draw();
                 updateStats();
            }
        });
        
        // --- Initial Setup ---
        window.onload = init;
    </script>
</body>
</html>
