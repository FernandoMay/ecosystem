<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Ecosystem Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a202c;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }
        canvas {
            background-color: #2d3748;
            border-radius: 0.5rem;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=400;600;700&display=swap" rel="stylesheet">
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <h1 class="text-4xl font-bold mb-4">Virtual Ecosystem Simulation</h1>
    <div id="stats" class="text-lg mb-4">
        <span>Day: <span id="day">0</span></span> |
        <span>Herbivores: <span id="herbivore-count">0</span></span> |
        <span>Carnivores: <span id="carnivore-count">0</span></span> |
        <span>Plants: <span id="plant-count">0</span></span>
    </div>

    <canvas id="ecosystem" width="800" height="600"></canvas>

    <div class="mt-4 flex items-center space-x-4">
        <button id="start-pause" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">Start</button>
        <button id="restart" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">Restart</button>
        <label class="text-sm">
            Speed:
            <select id="speed" class="bg-gray-700 text-white rounded px-2 py-1 ml-1">
                <option value="200">0.5×</option>
                <option value="100" selected>1×</option>
                <option value="50">2×</option>
                <option value="16">8×</option>
            </select>
        </label>
    </div>

    <p class="mt-2 text-sm text-gray-400">Click the canvas to spawn a herbivore.</p>

    <script type="module" src="src/main.js"></script>
</body>
</html>
